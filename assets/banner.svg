<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120"><defs><linearGradient id="bgGrad" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="990" y2="10"><stop offset="0" stop-color="#0A2540"></stop><stop offset="1" stop-color="#15528F"></stop></linearGradient><linearGradient id="shim" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.1"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient><clipPath id="bannerClip"><rect x="10" y="10" width="980" height="100" rx="18" ry="18"></rect></clipPath></defs><rect width="980" height="100" x="10" y="10" rx="18" ry="18" fill="url(#bgGrad)" stroke-width="1" stroke="#24405f"></rect><g class="shimmer"><rect width="140" height="100" x="0" y="10" fill="url(#shim)" clip-path="url(#bannerClip)"></rect></g><text x="500" y="54" font-family="'Segoe UI','Fira Code',sans-serif" font-size="25" font-weight="700" fill="#E6EDF7" text-anchor="middle">I turn ideas into complete, well-documented systems.</text><text x="500" y="84" font-family="'Segoe UI','Fira Code',sans-serif" font-size="14" fill="#8CA3C2" text-anchor="middle">Learn by shipping — from pure-CSS art to full-stack AI SaaS.</text><style>@keyframes shimmer{0%{transform:translateX(-240px)}100%{transform:translateX(1160px)}}
@keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.95}}
.shimmer{animation:shimmer 4.2s ease-in-out infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite}</style></svg>