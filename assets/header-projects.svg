<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;display=swap');
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      
      .container {
        font-family: 'Space Grotesk', sans-serif;
        background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 50%, #1e1e2e 100%);
        width: 100%;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 40px;
        box-sizing: border-box;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }
      
      .container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.2), transparent);
        background-size: 200% 100%;
        animation: shimmer 3s linear infinite;
      }
      
      .content {
        display: flex;
        align-items: center;
        gap: 24px;
        z-index: 1;
        animation: fadeIn 0.8s ease-out;
      }
      
      .project-icons {
        display: flex;
        gap: 12px;
      }
      
      .project-icon {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        animation: float 3s ease-in-out infinite;
      }
      
      .project-icon:nth-child(2) {
        animation-delay: 0.5s;
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
      }
      
      .project-icon:nth-child(3) {
        animation-delay: 1s;
        background: linear-gradient(135deg, #6d28d9, #5b21b6);
      }
      
      .text {
        display: flex;
        flex-direction: column;
      }
      
      .title {
        color: #ffffff;
        font-size: 32px;
        font-weight: 700;
        margin: 0;
        line-height: 1.2;
      }
      
      .subtitle {
        color: #a78bfa;
        font-size: 16px;
        font-weight: 400;
        margin: 4px 0 0 0;
        opacity: 0.9;
      }
      
      @media (prefers-reduced-motion: reduce) {
        .container::before,
        .project-icon,
        .content {
          animation: none;
        }
      }
    </style>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="container">
      <div class="content">
        <div class="project-icons">
          <div class="project-icon">🚀</div>
          <div class="project-icon">🔧</div>
          <div class="project-icon">🎯</div>
        </div>
        <div class="text">
          <h1 class="title">Featured Projects</h1>
          <p class="subtitle">Production-grade systems, not demos</p>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
