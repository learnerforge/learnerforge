<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      
      @keyframes chartGrow {
        from { transform: scaleY(0); }
        to { transform: scaleY(1); }
      }
      
      @keyframes counter {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes slideRight {
        from { transform: translateX(-20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      .container {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #161b22 0%, #0d1117 50%, #161b22 100%);
        width: 100%;
        height: 120px;
        display: flex;
        align-items: center;
        padding: 0 40px;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid #30363d;
        overflow: hidden;
        position: relative;
      }
      
      .chart-bg {
        position: absolute;
        bottom: 20px;
        left: 40px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        opacity: 0.2;
      }
      
      .bar {
        width: 12px;
        background: linear-gradient(to top, #8b5cf6, #a78bfa);
        border-radius: 4px 4px 0 0;
        transform-origin: bottom;
        animation: chartGrow 1s ease-out forwards;
      }
      
      .bar:nth-child(1) { height: 30px; animation-delay: 0.1s; }
      .bar:nth-child(2) { height: 50px; animation-delay: 0.2s; }
      .bar:nth-child(3) { height: 40px; animation-delay: 0.3s; }
      .bar:nth-child(4) { height: 70px; animation-delay: 0.4s; }
      .bar:nth-child(5) { height: 60px; animation-delay: 0.5s; }
      .bar:nth-child(6) { height: 80px; animation-delay: 0.6s; }
      .bar:nth-child(7) { height: 45px; animation-delay: 0.7s; }
      
      .content {
        display: flex;
        align-items: center;
        gap: 24px;
        z-index: 1;
      }
      
      .stats-icon {
        font-size: 56px;
        animation: counter 0.8s ease-out;
      }
      
      .text {
        display: flex;
        flex-direction: column;
      }
      
      .title {
        color: #ffffff;
        font-size: 32px;
        font-weight: 700;
        margin: 0;
        line-height: 1.2;
        animation: slideRight 0.8s ease-out;
      }
      
      .subtitle {
        color: #8b5cf6;
        font-size: 16px;
        font-weight: 400;
        margin: 4px 0 0 0;
        opacity: 0.9;
        animation: slideRight 0.8s ease-out 0.2s both;
      }
      
      @media (prefers-reduced-motion: reduce) {
        .bar,
        .stats-icon,
        .title,
        .subtitle {
          animation: none;
        }
      }
    </style>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="container">
      <div class="chart-bg">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="content">
        <div class="stats-icon">📊</div>
        <div class="text">
          <h1 class="title">GitHub Analytics</h1>
          <p class="subtitle">Consistent shipping, growing impact</p>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
