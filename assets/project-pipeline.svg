<svg xmlns="http://www.w3.org/2000/svg" width="980" height="190" viewBox="0 0 980 190" role="img" aria-label="Project pipeline">
  <defs>
    <filter id="pipe-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="980" height="190" rx="16" fill="#0A2540" stroke="#12294A" stroke-width="2"/>

  <g fill="none" stroke="#2E6FBF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M185 95 l14 10 l-14 10"/>
    <path d="M375 95 l14 10 l-14 10"/>
    <path d="M565 95 l14 10 l-14 10"/>
    <path d="M755 95 l14 10 l-14 10"/>
  </g>

  <g fill="none">
    <circle r="5" fill="#FFB74D" filter="url(#pipe-glow)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M90 95 H850"/>
    </circle>
    <circle r="5" fill="#6CC6FF" filter="url(#pipe-glow)">
      <animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M90 95 H850"/>
    </circle>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <rect x="25" y="63" width="130" height="64" rx="10" fill="none" stroke="#FFB74D" stroke-width="2.5" filter="url(#pipe-glow)" stroke-opacity="0.2">
      <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="25" y="63" width="130" height="64" rx="10" fill="#0E2A4D" stroke="#FFB74D" stroke-width="2.5"/>
    <text x="90" y="98" font-size="17" font-weight="700" fill="#FFB74D">Idea</text>
    <text x="90" y="118" font-size="11" fill="#8B9BB4">1 problem</text>

    <rect x="215" y="63" width="130" height="64" rx="10" fill="none" stroke="#6CC6FF" stroke-width="2.5" filter="url(#pipe-glow)" stroke-opacity="0.2">
      <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="3.5s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="215" y="63" width="130" height="64" rx="10" fill="#0E2A4D" stroke="#6CC6FF" stroke-width="2.5"/>
    <text x="280" y="98" font-size="17" font-weight="700" fill="#6CC6FF">Prototype</text>
    <text x="280" y="118" font-size="11" fill="#8B9BB4">prove it works</text>

    <rect x="405" y="63" width="130" height="64" rx="10" fill="none" stroke="#3FA1FF" stroke-width="2.5" filter="url(#pipe-glow)" stroke-opacity="0.2">
      <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="3.5s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="405" y="63" width="130" height="64" rx="10" fill="#0E2A4D" stroke="#3FA1FF" stroke-width="2.5"/>
    <text x="470" y="98" font-size="17" font-weight="700" fill="#3FA1FF">MVP</text>
    <text x="470" y="118" font-size="11" fill="#8B9BB4">real users</text>

    <rect x="595" y="63" width="130" height="64" rx="10" fill="none" stroke="#3FA1FF" stroke-width="2.5" filter="url(#pipe-glow)" stroke-opacity="0.2">
      <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="3.5s" begin="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="595" y="63" width="130" height="64" rx="10" fill="#0E2A4D" stroke="#3FA1FF" stroke-width="2.5"/>
    <text x="660" y="98" font-size="17" font-weight="700" fill="#3FA1FF">Production</text>
    <text x="660" y="118" font-size="11" fill="#8B9BB4">host + monitor</text>

    <rect x="785" y="63" width="130" height="64" rx="10" fill="none" stroke="#6CC6FF" stroke-width="2.5" filter="url(#pipe-glow)" stroke-opacity="0.2">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="3.5s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="785" y="63" width="130" height="64" rx="10" fill="#0E2A4D" stroke="#6CC6FF" stroke-width="2.5"/>
    <text x="850" y="98" font-size="17" font-weight="700" fill="#6CC6FF">Open Source</text>
    <text x="850" y="118" font-size="11" fill="#8B9BB4">give it back</text>
  </g>
</svg>
