<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      
      @keyframes brainPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(139, 92, 246, 0.5)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.8)); }
      }
      
      @keyframes dataFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      
      @keyframes nodeGlow {
        0%, 100% { fill: #8b5cf6; }
        50% { fill: #a78bfa; }
      }
      
      .container {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
        width: 100%;
        height: 120px;
        display: flex;
        align-items: center;
        padding: 0 40px;
        box-sizing: border-box;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }
      
      .neural-bg {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        opacity: 0.1;
      }
      
      .node {
        fill: #8b5cf6;
        animation: nodeGlow 2s ease-in-out infinite;
      }
      
      .connection {
        stroke: #8b5cf6;
        stroke-width: 1;
        stroke-dasharray: 5, 5;
        animation: dataFlow 2s linear infinite;
      }
      
      .content {
        display: flex;
        align-items: center;
        gap: 24px;
        z-index: 1;
      }
      
      .brain-icon {
        font-size: 56px;
        animation: brainPulse 2s ease-in-out infinite;
      }
      
      .text {
        display: flex;
        flex-direction: column;
      }
      
      .title {
        color: #ffffff;
        font-size: 32px;
        font-weight: 700;
        margin: 0;
        line-height: 1.2;
      }
      
      .subtitle {
        color: #8b5cf6;
        font-size: 16px;
        font-weight: 400;
        margin: 4px 0 0 0;
        opacity: 0.9;
      }
      
      @media (prefers-reduced-motion: reduce) {
        .brain-icon,
        .node,
        .connection {
          animation: none;
        }
      }
    </style>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="container">
      <svg class="neural-bg" viewBox="0 0 800 120">
        <circle class="node" cx="100" cy="30" r="4"/>
        <circle class="node" cx="200" cy="60" r="4"/>
        <circle class="node" cx="300" cy="20" r="4"/>
        <circle class="node" cx="400" cy="80" r="4"/>
        <circle class="node" cx="500" cy="40" r="4"/>
        <circle class="node" cx="600" cy="70" r="4"/>
        <circle class="node" cx="700" cy="30" r="4"/>
        <line class="connection" x1="100" y1="30" x2="200" y2="60"/>
        <line class="connection" x1="200" y1="60" x2="300" y2="20"/>
        <line class="connection" x1="300" y1="20" x2="400" y2="80"/>
        <line class="connection" x1="400" y1="80" x2="500" y2="40"/>
        <line class="connection" x1="500" y1="40" x2="600" y2="70"/>
        <line class="connection" x1="600" y1="70" x2="700" y2="30"/>
      </svg>
      <div class="content">
        <div class="brain-icon">🧠</div>
        <div class="text">
          <h1 class="title">AI / ML Expertise</h1>
          <p class="subtitle">Building intelligent systems from research to production</p>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
