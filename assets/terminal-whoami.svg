<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-label="Terminal whoami">
  <defs>
    <clipPath id="term-clip"><rect x="6" y="6" width="748" height="308" rx="12"/></clipPath>
    <filter id="term-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="320" rx="14" fill="#0A2540" stroke="#12294A" stroke-width="2"/>

  <g clip-path="url(#term-clip)">
    <rect x="6" y="6" width="748" height="34" fill="#12294A"/>
    <circle cx="28" cy="23" r="6" fill="#FF5F57"/>
    <circle cx="48" cy="23" r="6" fill="#FEBC2E"/>
    <circle cx="68" cy="23" r="6" fill="#28C840"/>
    <text x="380" y="28" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#8B9BB4">learnerforge: ~/whoami</text>

    <g font-family="Fira Code, Consolas, monospace">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="0.4s" fill="freeze"/>
        <text x="24" y="72" font-size="17" fill="#FFB74D">$</text>
        <text x="44" y="72" font-size="17" fill="#6CC6FF">whoami</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.0s" fill="freeze"/>
        <text x="24" y="98" font-size="17" fill="#E6EDF3">ganesh-bakkera &#183; AI &amp; ML B.Tech @ MGIT Hyderabad</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="1.6s" fill="freeze"/>
        <text x="24" y="130" font-size="17" fill="#FFB74D">$</text>
        <text x="44" y="130" font-size="17" fill="#6CC6FF">cat interests</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.2s" fill="freeze"/>
        <text x="24" y="156" font-size="17" fill="#E6EDF3">AI agents &#183; agentic workflows &#183; full-stack AI systems</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.8s" fill="freeze"/>
        <text x="24" y="188" font-size="17" fill="#FFB74D">$</text>
        <text x="44" y="188" font-size="17" fill="#6CC6FF">ls ./now</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="3.4s" fill="freeze"/>
        <text x="24" y="214" font-size="17" fill="#E6EDF3">PathForge AI (prod) &#183; Remote_Mouse (daily) &#183; internship hunt</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="4.0s" fill="freeze"/>
        <text x="24" y="246" font-size="17" fill="#FFB74D">$</text>
        <text x="44" y="246" font-size="17" fill="#6CC6FF">./goal</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="4.6s" fill="freeze"/>
        <text x="24" y="272" font-size="17" fill="#FFB74D">internship-ready by 2027</text>
      </g>
    </g>

    <rect x="44" y="264" width="11" height="20" rx="2" fill="#FFB74D" filter="url(#term-glow)">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
