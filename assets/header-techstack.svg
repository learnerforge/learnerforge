<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      
      @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
      }
      
      @keyframes blink {
        0%, 100% { border-color: transparent; }
        50% { border-color: #8b5cf6; }
      }
      
      @keyframes glow {
        0%, 100% { box-shadow: 0 0 5px rgba(139, 92, 246, 0.5); }
        50% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.8); }
      }
      
      .container {
        font-family: 'JetBrains Mono', monospace;
        background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #21262d 100%);
        width: 100%;
        height: 120px;
        display: flex;
        align-items: center;
        padding: 0 40px;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid #30363d;
        overflow: hidden;
        position: relative;
      }
      
      .terminal {
        background: #0d1117;
        border-radius: 8px;
        padding: 16px 24px;
        border: 1px solid #30363d;
        animation: glow 2s ease-in-out infinite;
      }
      
      .prompt {
        color: #7ee787;
        font-size: 14px;
        margin: 0;
      }
      
      .command {
        color: #f0f6fc;
        font-size: 24px;
        font-weight: 700;
        margin: 8px 0 0 0;
        display: flex;
        align-items: center;
      }
      
      .cursor {
        display: inline-block;
        width: 3px;
        height: 24px;
        background: #8b5cf6;
        margin-left: 4px;
        animation: blink 1s step-end infinite;
      }
      
      .badge {
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        color: white;
        padding: 4px 12px;
        border-radius: 16px;
        font-size: 12px;
        font-weight: 600;
        margin-left: 16px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      
      @media (prefers-reduced-motion: reduce) {
        .cursor,
        .terminal {
          animation: none;
        }
      }
    </style>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="container">
      <div class="terminal">
        <p class="prompt">$ ls tech-stack/</p>
        <div class="command">
          Tech Stack
          <span class="cursor"></span>
          <span class="badge">24 technologies</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
