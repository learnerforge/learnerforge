<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560" role="img" aria-label="Skill radar chart">
  <defs>
    <filter id="radar-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="radar-fill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB74D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3FA1FF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="520" height="560" rx="16" fill="#0A2540" stroke="#12294A" stroke-width="2"/>

  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <polygon points="260,100 415.9,190 415.9,370 260,460 104.1,370 104.1,190" fill="none" stroke="#12294A" stroke-width="1.5"/>
    <polygon points="260,145 376.9,212.5 376.9,347.5 260,415 143.1,347.5 143.1,212.5" fill="none" stroke="#12294A" stroke-width="1"/>
    <polygon points="260,190 337.9,235 337.9,325 260,370 182.1,325 182.1,235" fill="none" stroke="#12294A" stroke-width="1"/>
    <polygon points="260,235 298.9,257.5 298.9,302.5 260,325 221.1,302.5 221.1,257.5" fill="none" stroke="#12294A" stroke-width="1"/>

    <line x1="260" y1="280" x2="260" y2="100" stroke="#12294A" stroke-width="1"/>
    <line x1="260" y1="280" x2="415.9" y2="190" stroke="#12294A" stroke-width="1"/>
    <line x1="260" y1="280" x2="415.9" y2="370" stroke="#12294A" stroke-width="1"/>
    <line x1="260" y1="280" x2="260" y2="460" stroke="#12294A" stroke-width="1"/>
    <line x1="260" y1="280" x2="104.1" y2="370" stroke="#12294A" stroke-width="1"/>
    <line x1="260" y1="280" x2="104.1" y2="190" stroke="#12294A" stroke-width="1"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 260 280" to="360 260 280" dur="9s" repeatCount="indefinite"/>
      <polygon points="260,280 260,100 375,190" fill="#3FA1FF" opacity="0.13"/>
      <line x1="260" y1="280" x2="260" y2="100" stroke="#FFB74D" stroke-width="2" opacity="0.85" filter="url(#radar-glow)"/>
    </g>

    <polygon points="260,109 392.5,203.5 384.7,352 260,415 174.3,329.5 150.9,217" fill="url(#radar-fill)" stroke="#6CC6FF" stroke-width="2.5" stroke-linejoin="round" pathLength="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.6s" fill="freeze"/>
      <animate attributeName="opacity" values="0.35;1;0.35" dur="5s" begin="2s" repeatCount="indefinite"/>
    </polygon>

    <circle cx="260" cy="109" r="4.5" fill="#6CC6FF" filter="url(#radar-glow)"/>
    <circle cx="392.5" cy="203.5" r="4.5" fill="#6CC6FF" filter="url(#radar-glow)"/>
    <circle cx="384.7" cy="352" r="4.5" fill="#6CC6FF" filter="url(#radar-glow)"/>
    <circle cx="260" cy="415" r="4.5" fill="#6CC6FF" filter="url(#radar-glow)"/>
    <circle cx="174.3" cy="329.5" r="4.5" fill="#6CC6FF" filter="url(#radar-glow)"/>
    <circle cx="150.9" cy="217" r="4.5" fill="#6CC6FF" filter="url(#radar-glow)"/>

    <text x="260" y="72" font-size="15" font-weight="700" fill="#E6EDF3">Python</text>
    <text x="260" y="88" font-size="11" fill="#8B9BB4">95%</text>
    <text x="437.5" y="176" font-size="15" font-weight="700" fill="#E6EDF3">FastAPI</text>
    <text x="437.5" y="192" font-size="11" fill="#8B9BB4">85%</text>
    <text x="437.5" y="382" font-size="15" font-weight="700" fill="#E6EDF3">React</text>
    <text x="437.5" y="398" font-size="11" fill="#8B9BB4">80%</text>
    <text x="260" y="493" font-size="15" font-weight="700" fill="#E6EDF3">AI / ML</text>
    <text x="260" y="509" font-size="11" fill="#8B9BB4">75%</text>
    <text x="77" y="382" font-size="15" font-weight="700" fill="#E6EDF3">Docker</text>
    <text x="77" y="398" font-size="11" fill="#8B9BB4">55%</text>
    <text x="77" y="176" font-size="15" font-weight="700" fill="#E6EDF3">SQL</text>
    <text x="77" y="192" font-size="11" fill="#8B9BB4">70%</text>
  </g>

  <text x="260" y="545" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8B9BB4">confidence from shipped projects, not tutorials</text>
</svg>
