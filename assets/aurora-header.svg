<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Aurora banner">
  <defs>
    <clipPath id="aurora-clip"><rect width="1000" height="240" rx="22"/></clipPath>
    <filter id="aurora-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <linearGradient id="aurora-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6CC6FF"/>
      <stop offset="55%" stop-color="#3FA1FF"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
    <linearGradient id="aurora-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6CC6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3FA1FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A2540" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#aurora-clip)">
    <rect width="1000" height="240" fill="#0A2540"/>

    <g filter="url(#aurora-blur)">
      <ellipse cx="190" cy="130" rx="300" ry="130" fill="#2E6FBF" opacity="0.55">
        <animate attributeName="cx" values="190;330;190" dur="17s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="740" cy="150" rx="320" ry="140" fill="#3FA1FF" opacity="0.38">
        <animate attributeName="cy" values="150;70;150" dur="21s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="500" cy="30" rx="270" ry="95" fill="#FFB74D" opacity="0.14">
        <animate attributeName="cx" values="500;640;500" dur="25s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="850" cy="60" rx="220" ry="90" fill="#6CC6FF" opacity="0.25">
        <animate attributeName="cy" values="60;160;60" dur="19s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="320" cy="210" rx="260" ry="90" fill="#12294A" opacity="0.9">
        <animate attributeName="cx" values="320;460;320" dur="23s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <rect width="1000" height="240" fill="url(#aurora-scan)"/>

    <g fill="#9FB8DA">
      <circle cx="120" cy="50" r="1.6" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="90" r="1.2" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="40" r="1.4" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="70" r="1.2" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="5.5s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="45" r="1.6" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4.2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="95" r="1.3" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="40" r="1.4" opacity="0"><animate attributeName="opacity" values="0;0.8;0" dur="4.7s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="170" r="1.3" opacity="0"><animate attributeName="opacity" values="0;0.6;0" dur="5.2s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <text x="500" y="118" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="url(#aurora-title)">
      Ganesh Bakkera
      <animate attributeName="opacity" values="0;0.2;1" keyTimes="0;0.4;1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="500" y="160" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#9FB8DA" letter-spacing="3">
      AI &amp; ML B.Tech &#183; MGIT Hyderabad &#183; learnerforge
      <animate attributeName="opacity" values="0;1" dur="1.4s" begin="0.6s" fill="freeze"/>
    </text>

    <rect x="150" y="184" width="700" height="3" rx="1.5" fill="none" stroke="#3FA1FF" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.6;0.15;0.6" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
