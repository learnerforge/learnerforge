<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="800" height="40">
  <defs>
    <style>
      @keyframes flow {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      
      .divider {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      
      .line {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #8b5cf6, transparent);
        transform: translateY(-50%);
      }
      
      .glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 60px;
        height: 60px;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.3), transparent);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        animation: pulse 2s ease-in-out infinite;
      }
      
      .dots {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 2px;
        transform: translateY(-50%);
      }
      
      .dot {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #8b5cf6;
        border-radius: 50%;
        top: 50%;
        transform: translateY(-50%);
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      .dot:nth-child(1) { left: 20%; animation-delay: 0s; }
      .dot:nth-child(2) { left: 40%; animation-delay: 0.3s; }
      .dot:nth-child(3) { left: 60%; animation-delay: 0.6s; }
      .dot:nth-child(4) { left: 80%; animation-delay: 0.9s; }
      
      @media (prefers-reduced-motion: reduce) {
        .glow,
        .dot {
          animation: none;
        }
      }
    </style>
  </defs>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="divider">
      <div class="line"></div>
      <div class="glow"></div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </foreignObject>
</svg>
